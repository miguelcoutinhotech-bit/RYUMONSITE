<!DOCTYPE html>
<!-- ======================================================================
     RYŪMON  |  busca.html
     Busca com filtros.
     ----------------------------------------------------------------------
     COMO LER OS COMENTÁRIOS (pra quem for ler meu código):
       ====== 1. TÍTULO ======   -> nível 1 (parte grande da página)
       ==== 1.1 Título ====      -> nível 2 (subparte)
       ---- 1.1.1 título ----    -> nível 3 (detalhe pequeno)
       texto normal              -> explicação do que eu fiz
     ====================================================================== -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busca — RYŪMON</title>
<link rel="icon" href="img/favicon.png">
<!-- Esse script pequeno roda ANTES da página aparecer: se o tema salvo (localStorage) for "escuro", -->
<!-- já coloca a classe darkmode no <html>. Assim a página não pisca branca antes de ficar escura. -->
<script>
  if (localStorage.getItem("tema") == "escuro") { document.documentElement.classList.add("darkmode"); }
</script>
<!-- Fontes do Google: Cormorant Garamond (títulos), Inter (texto) e Noto Serif JP (kanji). -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<!-- onload = evento que roda quando a página termina de carregar. -->
<!-- iniciarPagina() está no site.js (cabeçalho, carrinho). E iniciarBusca() é a função própria desta página. -->
<body onload="iniciarPagina(); iniciarBusca()">
<!-- Dragão de fundo (a imagem muda no CSS conforme o tema). -->
<div class="dragon-bg" aria-hidden="true"></div>

<!-- ======================================================================
     1. CABEÇALHO (igual em todas as páginas)
     ====================================================================== -->
<!-- Só muda qual link fica dourado (class="active"), que é o da página onde a pessoa está. -->
<header class="site-header"><div class="container nav">
  <!-- ==== 1.1 Logo ==== -->
  <!-- oncontextmenu = evento do clique com o botão DIREITO. Chama avisoLogo() (está no site.js). -->
  <a class="brand" href="index.html"><img src="img/logo.png" alt="Logo RYŪMON: carpa koi" width="48" height="48" oncontextmenu="return avisoLogo()"><span>RYŪMON</span></a>
  <!-- ==== 1.2 Botão do menu (só aparece no celular) ==== -->
  <button class="menu-btn" onclick="abrirMenu()" aria-label="Abrir menu">☰</button>
  <div class="nav-panel" id="nav-panel">
    <!-- ==== 1.3 Links de navegação ==== -->
    <nav class="nav-links"><a href="index.html">Início</a><a href="produtos.html">Cardápio</a><a href="pedidos.html">Pedidos</a><a href="perfil.html">Perfil</a></nav>
    <!-- ==== 1.4 Busca do cabeçalho ==== -->
    <!-- onsubmit: confere se digitou algo antes de ir pra busca.html (função enviarBuscaTopo). -->
<!-- onsearch: evento do campo type="search" (quando aperta Enter). -->
    <form class="search" action="busca.html" onsubmit="return enviarBuscaTopo()">
      <input type="search" name="q" id="busca-topo" placeholder="Buscar no cardápio…" maxlength="40" onsearch="aoPesquisar(this)" aria-label="Buscar no cardápio">
      <button type="submit" aria-label="Buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </form>
    <!-- ==== 1.5 Botões da direita ==== -->
    <div class="nav-actions">
      <!-- ---- 1.5.1 trocar tema claro/escuro ---- -->
      <button class="theme-toggle" onclick="trocarTema()" aria-label="Alternar modo claro e escuro"><span class="knob"></span></button>
      <!-- ---- 1.5.2 carrinho (o número é preenchido pelo JavaScript) ---- -->
      <a class="cart-link" href="carrinho.html">Carrinho <span class="badge cart-count">0</span></a>
      <!-- ---- 1.5.3 Entrar/Cadastrar ou "Olá, Fulano" (o JavaScript preenche aqui, ver montarAreaLogin) ---- -->
      <div id="auth-area"></div>
    </div>
  </div>
</div></header>

<!-- ======================================================================
     2. CONTEÚDO DA BUSCA
     ====================================================================== -->
<main class="container">
  <!-- ==== 2.1 Campo de busca grande ==== -->
  <!-- oninput: busca a cada letra digitada | onsearch: quando aperta Enter | onselect: mostra o texto selecionado no console. -->
  <form class="big-search" onsubmit="return enviarBusca()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" maxlength="40" placeholder="Buscar pratos, ingredientes…" aria-label="Buscar no cardápio" autocomplete="off" oninput="mostrarResultados()" onsearch="mostrarResultados()" onselect="mostrarSelecao(this)">
    <button class="btn btn-gold" type="submit">Buscar</button>
  </form>
  <div class="search-layout">
    <!-- ==== 2.2 Filtros (coluna da esquerda) ==== -->
    <!-- onchange: roda quando o usuário marca/desmarca um checkbox ou escolhe outra opção. -->
<!-- onreset: o botão "Limpar filtros" (type="reset") chama aoLimparFiltros(). -->
    <aside class="card filters">
      <form onreset="aoLimparFiltros()">
        <h2>Filtros</h2>
        <!-- ---- 2.2.1 categoria ---- -->
        <h3>Categoria</h3>
        <label class="check"><input type="checkbox" name="cat" value="sushi" onchange="mostrarResultados()"> Sushi</label>
        <label class="check"><input type="checkbox" name="cat" value="sashimi" onchange="mostrarResultados()"> Sashimi</label>
        <label class="check"><input type="checkbox" name="cat" value="uramaki" onchange="mostrarResultados()"> Uramaki</label>
        <label class="check"><input type="checkbox" name="cat" value="ramen" onchange="mostrarResultados()"> Ramen</label>
        <label class="check"><input type="checkbox" name="cat" value="tempura" onchange="mostrarResultados()"> Tempurá</label>
        <label class="check"><input type="checkbox" name="cat" value="sobremesa" onchange="mostrarResultados()"> Sobremesas</label>
        <label class="check"><input type="checkbox" name="cat" value="bebida" onchange="mostrarResultados()"> Bebidas</label>
        <!-- ---- 2.2.2 preço máximo (barrinha) ---- -->
        <h3>Preço máximo</h3>
        <input type="range" id="max" min="10" max="120" step="5" value="120" oninput="mostrarResultados()" aria-label="Preço máximo">
        <div class="range-lbl"><span>R$ 10</span><strong id="max-lbl"></strong></div>
        <!-- ---- 2.2.3 ordenar e limpar ---- -->
        <h3>Ordenar</h3>
        <select id="ordem" onchange="mostrarResultados()" aria-label="Ordenar resultados" style="width:100%"><option value="popular">Mais pedidos</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option><option value="az">Nome (A–Z)</option></select>
        <button class="btn btn-out btn-block" type="reset" style="margin-top:22px">Limpar filtros</button>
      </form>
    </aside>
    <!-- ==== 2.3 Resultados (coluna da direita) ==== -->
    <section>
      <div class="res-head"><h2 id="res-title"></h2><span id="res-count" class="page-sub"></span></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</main>

<!-- ======================================================================
     3. RODAPÉ (igual em todas as páginas)
     ====================================================================== -->
<footer class="site-footer"><div class="container">
  <div class="foot-grid">
    <div><a class="brand" href="index.html"><img src="img/logo.png" alt="" width="40" height="40"><span>RYŪMON</span></a>
      <p style="margin-top:10px">Culinária japonesa, do nosso dojo à sua mesa.</p></div>
    <ul><li><a href="produtos.html">Cardápio</a></li><li><a href="pedidos.html">Meus pedidos</a></li><li><a href="carrinho.html">Carrinho</a></li></ul>
    <ul><li><a href="mailto:contato@ryumon.com.br">contato@ryumon.com.br</a></li><li><span style="font-size:.9rem">(00) 0000-0000</span></li></ul>
  </div>
  <p class="copy">© 2026 RYŪMON — Projeto escolar</p>
</div></footer>

<!-- Aviso rápido que aparece e some (função aviso() do site.js). -->
<div class="toast" id="aviso" role="status"></div>

<!-- ======================================================================
     4. SCRIPTS (a ordem importa: um arquivo usa as funções do anterior)
     ====================================================================== -->
<script src="js/dados.js"></script>
<script src="js/mascaras.js"></script>
<script src="js/site.js"></script>
<script src="js/busca.js"></script>
</body>
</html>
